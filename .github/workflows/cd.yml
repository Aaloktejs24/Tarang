name: CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/auth/Dockerfile
          push: false
          tags: tarang-auth:latest

      - name: Build User Service
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/user/Dockerfile
          push: false
          tags: tarang-user:latest

      - name: Build Notification Worker
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/notification/Dockerfile
          push: false
          tags: tarang-notification:latest
