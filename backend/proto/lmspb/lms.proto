syntax = "proto3";

package lmspb;

option go_package = "backend/proto/lmspb";

// Data Models
message Topic {
  string id = 1;
  string title = 2;
  string start_date = 3;
  string end_date = 4;
  string access = 5;
  string description = 6;
  string document_url = 7;
  string video_url = 8;
  repeated Topic children = 9;
}

message Module {
  string id = 1;
  string title = 2;
  string start_date = 3;
  string end_date = 4;
  string access = 5;
  string description = 6;
  repeated Topic children = 7;
}

message Course {
  string id = 1;
  string title = 2;
  string desc = 3;
  string audience = 4;
  string category = 5;
  repeated string tags = 6;
  string image = 7;
  string status = 8;
  int32 students = 9;
  repeated Module modules = 10;
  string created_at = 11;
  string updated_at = 12;
  string document = 13;
}

message Student {
  string id = 1;
  string name = 2;
  string email = 3;
  string profile_pic = 4;
}

// Requests & Responses
message CreateCourseRequest {
  Course course = 1;
}

message CreateCourseResponse {
  string id = 1;
}

message GetCourseRequest {
  string id = 1;
}

message GetCourseResponse {
  Course course = 1;
}

message ListCoursesRequest {
  // Add pagination/filtering if needed later
}

message ListCoursesResponse {
  repeated Course courses = 1;
}

message UpdateCourseRequest {
  Course course = 1;
}

message UpdateCourseResponse {
  bool success = 1;
}

message DeleteCourseRequest {
  string id = 1;
}

message DeleteCourseResponse {
  bool success = 1;
}

message EnrollCourseRequest {
  string course_id = 1;
  string student_id = 2;
  string student_name = 3;
  string student_email = 4;
  string profile_pic = 5;
}

message EnrollCourseResponse {
  bool success = 1;
}

message GetEnrolledCoursesRequest {
  string student_id = 1;
}

message GetEnrolledCoursesResponse {
  repeated Course courses = 1;
}

message GetCourseStudentsRequest {
  string course_id = 1;
}

message GetCourseStudentsResponse {
  repeated Student students = 1;
}


// Service Definition
service LMSService {
  rpc CreateCourse(CreateCourseRequest) returns (CreateCourseResponse);
  rpc GetCourse(GetCourseRequest) returns (GetCourseResponse);
  rpc ListCourses(ListCoursesRequest) returns (ListCoursesResponse);
  rpc UpdateCourse(UpdateCourseRequest) returns (UpdateCourseResponse);
  rpc DeleteCourse(DeleteCourseRequest) returns (DeleteCourseResponse);
  
  // Enrollment
  rpc EnrollCourse(EnrollCourseRequest) returns (EnrollCourseResponse);
  rpc GetEnrolledCourses(GetEnrolledCoursesRequest) returns (GetEnrolledCoursesResponse);
  rpc GetCourseStudents(GetCourseStudentsRequest) returns (GetCourseStudentsResponse);
}
