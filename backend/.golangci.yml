version: "2"
linters:
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - errcheck
        text: 'Error return value of `.*\.(Write|Encode|Rollback|Ack|Nack|[uU]pdateStatus|UpdateJobStatus|UpdateCourse)` is not checked'
      - linters:
          - staticcheck
        text: '.*middleware\.RealIP is deprecated.*'
      - linters:
          - staticcheck
        text: 'ST1005: error strings should not be capitalized'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
