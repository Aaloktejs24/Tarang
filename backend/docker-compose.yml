version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: tarang
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tarang_auth
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tarang -d tarang_auth" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  user-service:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    environment:
      - USER_DATABASE_URL
      - REDIS_ADDR
      - JWT_SECRET
      - ALE_MASTER_KEY
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - AWS_REGION
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - SANDBOX_API_KEY
      - SANDBOX_API_SECRET
      - DIGILOCKER_REDIRECT_URL
    ports:
      - "50051:50051"
      - "8081:8081"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      - AUTH_DATABASE_URL
      - REDIS_ADDR
      - USER_GRPC_URL
      - RABBIT_URL
      - PORT
      - JWT_SECRET
      - ALE_MASTER_KEY
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - SANDBOX_API_KEY
      - SANDBOX_API_SECRET
      - DIGILOCKER_REDIRECT_URL
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    environment:
      - RABBIT_URL
      - SES_SENDER_EMAIL
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION
      - OTEL_EXPORTER_OTLP_ENDPOINT
    depends_on:
      rabbitmq:
        condition: service_healthy

  admission-service:
    build:
      context: .
      dockerfile: services/admission/Dockerfile
    environment:
      - ADMISSION_DATABASE_URL
      - USER_GRPC_URL
      - PORT
      - JWT_SECRET
      - ALE_MASTER_KEY
      - OTEL_EXPORTER_OTLP_ENDPOINT
    ports:
      - "50052:50052"
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  krakend:
    image: devopsfaith/krakend:2.6.0
    volumes:
      - ./krakend.json:/etc/krakend/krakend.json
    ports:
      - "8000:8080"
    depends_on:
      - auth-service

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

volumes:
  pgdata:
