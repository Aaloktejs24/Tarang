services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: tarang
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tarang_auth
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tarang -d tarang_auth" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  user-service:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    environment:
      - USER_DATABASE_URL
      - REDIS_ADDR
      - JWT_SECRET
      - ALE_MASTER_KEY
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY
      - MINIO_USE_SSL=false
      - MINIO_PUBLIC_URL=http://localhost:9000
      - SANDBOX_API_KEY
      - SANDBOX_API_SECRET
      - DIGILOCKER_REDIRECT_URL
      - RABBIT_URL
      - MONGO_URI
    ports:
      - "50051:50051"
      - "8081:8081"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      - AUTH_DATABASE_URL
      - REDIS_ADDR
      - USER_GRPC_URL
      - RABBIT_URL
      - PORT
      - JWT_SECRET
      - ALE_MASTER_KEY
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - SANDBOX_API_KEY
      - SANDBOX_API_SECRET
      - DIGILOCKER_REDIRECT_URL
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY
      - MINIO_USE_SSL=false
      - MINIO_PUBLIC_URL=http://localhost:9000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    environment:
      - RABBIT_URL
      - SES_SENDER_EMAIL
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION
      - OTEL_EXPORTER_OTLP_ENDPOINT
    depends_on:
      rabbitmq:
        condition: service_healthy

  admission-service:
    build:
      context: .
      dockerfile: services/admission/Dockerfile
    environment:
      - MONGO_URI
      - REDIS_ADDR
      - USER_GRPC_URL
      - PORT
      - JWT_SECRET
      - ALE_MASTER_KEY
      - OTEL_EXPORTER_OTLP_ENDPOINT
    ports:
      - "50052:50052"
      - "8082:8082"
    depends_on:
      mongodb:
        condition: service_healthy

  lms-service:
    build:
      context: .
      dockerfile: services/lms/Dockerfile
    environment:
      - MONGO_URI
      - PORT=8085
    ports:
      - "50055:50055"
      - "8085:8085"
    depends_on:
      mongodb:
        condition: service_healthy

  krakend:
    image: devopsfaith/krakend:2.6.0
    volumes:
      - ./config/krakend.json:/etc/krakend/krakend.json
    ports:
      - "8000:8080"
    depends_on:
      - auth-service

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-create-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin};
      /usr/bin/mc mb myminio/tarang-user-service --ignore-existing;
      /usr/bin/mc anonymous set public myminio/tarang-user-service;
      /usr/bin/mc mb myminio/tarang-media-raw --ignore-existing;
      /usr/bin/mc mb myminio/tarang-media-processed --ignore-existing;
      /usr/bin/mc anonymous set public myminio/tarang-media-processed;
      /usr/bin/mc mb myminio/tarang-docs-raw --ignore-existing;
      /usr/bin/mc mb myminio/tarang-docs-processed --ignore-existing;
      /usr/bin/mc anonymous set public myminio/tarang-docs-processed;
      exit 0;
      "
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}

  streaming-api:
    build:
      context: .
      dockerfile: services/streaming-api/Dockerfile
    environment:
      - STREAMING_DATABASE_URL=postgresql://tarang:password@postgres:5432/tarang_auth?sslmode=disable
      - RABBIT_URL=amqp://guest:guest@rabbitmq:5672/
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY
      - MINIO_USE_SSL=false
      - MINIO_PUBLIC_URL=http://localhost:9000
      - PORT=8083
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  streaming-worker:
    build:
      context: .
      dockerfile: services/streaming-worker/Dockerfile
    environment:
      - STREAMING_DATABASE_URL=postgresql://tarang:password@postgres:5432/tarang_auth?sslmode=disable
      - RABBIT_URL=amqp://guest:guest@rabbitmq:5672/
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY
      - MINIO_USE_SSL=false
      - MINIO_PUBLIC_URL=http://localhost:9000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  viewer-api:
    build:
      context: .
      dockerfile: services/viewer-api/Dockerfile
    environment:
      - VIEWER_DATABASE_URL=postgresql://tarang:password@postgres:5432/tarang_auth?sslmode=disable
      - RABBIT_URL=amqp://guest:guest@rabbitmq:5672/
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY
      - MINIO_USE_SSL=false
      - MINIO_PUBLIC_URL=http://localhost:9000
      - PORT=8084
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  viewer-worker:
    build:
      context: .
      dockerfile: services/viewer-worker/Dockerfile
    environment:
      - VIEWER_DATABASE_URL=postgresql://tarang:password@postgres:5432/tarang_auth?sslmode=disable
      - RABBIT_URL=amqp://guest:guest@rabbitmq:5672/
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY
      - MINIO_USE_SSL=false
      - MINIO_PUBLIC_URL=http://localhost:9000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  minio_data:
  mongo_data:
