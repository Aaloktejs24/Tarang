global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'krakend-gateway'
    static_configs:
      - targets: ['krakend:8090']

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8080']

  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:50051']
